version: "3.8"

services:
  video-cutter:
    image: video-cutter:latest
    ports:
      - "8000:8000"
    environment:
      # FFmpeg tuning
      SILENCE_THRESHOLD:  "${SILENCE_THRESHOLD:--40}"
      SILENCE_DURATION:   "${SILENCE_DURATION:-0.5}"
      MIN_CLIP_DURATION:  "${MIN_CLIP_DURATION:-1.0}"
      # Google OAuth2
      GOOGLE_CLIENT_ID:     "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_API_KEY:       "${GOOGLE_API_KEY:-}"
      # App
      APP_URL:    "${APP_URL:-http://localhost:8000}"
      SECRET_KEY: "${SECRET_KEY}"
    volumes:
      - type: bind
        source: /tmp/video-cutter
        target: /tmp/video-cutter
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - video-net

networks:
  video-net:
    driver: overlay
